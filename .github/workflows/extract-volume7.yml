name: Generate volume 7 source extraction candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-volume7.yml"
      - "tools/extract_epub.py"
      - "tools/requirements.txt"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-volume7:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Compile extractor and run regression tests
        run: |
          python -m py_compile tools/extract_epub.py
          python -m unittest discover -s tests -v
      - name: Generate candidate for volume 7
        run: |
          set -e
          python tools/extract_epub.py --volume 7 --output-dir "$RUNNER_TEMP/volume7-candidate"
          cp "$RUNNER_TEMP/volume7-candidate/volume7.md" ./volume7.md
          cp "$RUNNER_TEMP/volume7-candidate/volume7_report.md" ./volume7_report.md
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## Volume 7 candidate files\n\n")
              for name in ("volume7.md", "volume7_report.md"):
                  data = Path(name).read_bytes()
                  out.write(f"- {name} — {len(data):,} bytes; SHA-256 {hashlib.sha256(data).hexdigest()}\n")
          PY
      - name: Publish candidate on a review branch (do not change main)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volume7.md volume7_report.md
          git commit -m "Generate volume 7 Japanese source extraction candidate"
          branch="chatgpt/volume7-extraction-$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          echo "Review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
