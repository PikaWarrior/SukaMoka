name: Publish translation chunks for volumes 4 and 5

on:
  push:
    branches: [main]
    paths:
      - "tools/split_volume.py"
      - "completed_volumes/volume4.md"
      - "completed_volumes/volume5.md"
      - ".github/workflows/cut-volumes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-cut-volumes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile splitter
        run: python -m py_compile tools/split_volume.py
      - name: Generate both variants for volumes 4 and 5
        run: |
          set -e
          python tools/split_volume.py completed_volumes/volume4.md --mode both --out-dir Cut_Volumes/Volume4
          python tools/split_volume.py completed_volumes/volume5.md --mode both --out-dir Cut_Volumes/Volume5
      - name: Verify generated outputs and summarize
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## Published translation chunks", ""]
          for volume in (4, 5):
              for variant in ("variant_A", "variant_B"):
                  folder = Path("Cut_Volumes") / f"Volume{volume}" / variant
                  chunks = sorted(folder.glob("chunk_*.md"))
                  index = folder / "_index.md"
                  if not chunks or not index.is_file():
                      raise SystemExit(f"Missing chunks or _index.md: {folder}")
                  chunk_texts = [p.read_text(encoding="utf-8").rstrip("\n") for p in chunks]
                  joined_text = "\n\n".join(chunk_texts)
                  if re.search(r"(?m)^##[ \t]+奥付[ \t]*$", joined_text):
                      raise SystemExit(f"Terminal colophon was not stripped from published chunks: {folder}")
                  sizes = [len(t) for t in chunk_texts]
                  line = (
                      f"- Volume {volume}, {variant}: {len(chunks)} chunks; "
                      f"min/max {min(sizes):,}/{max(sizes):,} characters"
                  )
                  print(line)
                  lines.append(line)
          summary.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Commit generated chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cut_Volumes/Volume4 Cut_Volumes/Volume5
          if git diff --cached --quiet; then
            echo "Generated chunks are already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Generate translation chunks for volumes 4 and 5"
          git push origin HEAD:main
