name: EPUB source extractor checks

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - "completed_volumes/volume4.md"
      - "completed_volumes/volume5.md"
      - "completed_volumes/volume6.md"
      - "completed_volumes/volume7.md"
      - "completed_volumes/volume8.md"
      - "completed_volumes/volume9.md"
      - "completed_volumes/volume10.md"
      - "completed_volumes/volume11.md"
      - "completed_volumes/volume4_report.md"
      - "completed_volumes/volume5_report.md"
      - "completed_volumes/volume6_report.md"
      - "completed_volumes/volume7_report.md"
      - "completed_volumes/volume8_report.md"
      - "completed_volumes/volume9_report.md"
      - "completed_volumes/volume10_report.md"
      - "completed_volumes/volume11_report.md"
      - ".github/workflows/extractor-tests.yml"
      - ".github/workflows/cut-volumes.yml"
      - ".github/workflows/extract-review-volumes-4-5.yml"
      - ".github/workflows/extract-volume5.yml"
      - ".github/workflows/extract-volume6.yml"
      - ".github/workflows/extract-volume7.yml"
      - ".github/workflows/extract-volume8.yml"
      - ".github/workflows/extract-volume9.yml"
      - ".github/workflows/extract-volume10.yml"
      - ".github/workflows/extract-volume11.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "completed_volumes/volume4.md"
      - "completed_volumes/volume5.md"
      - "completed_volumes/volume6.md"
      - "completed_volumes/volume7.md"
      - "completed_volumes/volume8.md"
      - "completed_volumes/volume9.md"
      - "completed_volumes/volume10.md"
      - "completed_volumes/volume11.md"
      - "completed_volumes/volume4_report.md"
      - "completed_volumes/volume5_report.md"
      - "completed_volumes/volume6_report.md"
      - "completed_volumes/volume7_report.md"
      - "completed_volumes/volume8_report.md"
      - "completed_volumes/volume9_report.md"
      - "completed_volumes/volume10_report.md"
      - "completed_volumes/volume11_report.md"
      - ".github/workflows/extractor-tests.yml"
      - ".github/workflows/cut-volumes.yml"
      - ".github/workflows/extract-review-volumes-4-5.yml"
      - ".github/workflows/extract-volume5.yml"
      - ".github/workflows/extract-volume6.yml"
      - ".github/workflows/extract-volume7.yml"
      - ".github/workflows/extract-volume8.yml"
      - ".github/workflows/extract-volume9.yml"
      - ".github/workflows/extract-volume10.yml"
      - ".github/workflows/extract-volume11.yml"
  workflow_dispatch:

jobs:
  extractor-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Compile extractor
        run: python -m py_compile tools/extract_epub.py
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile splitter and smoke-test chunks for completed volumes 4 through 11
        run: |
          python -m py_compile tools/split_volume.py
          set -e
          for volume in 4 5 6 7 8 9 10 11; do
            source="completed_volumes/volume${volume}.md"
            out="$RUNNER_TEMP/split-volume${volume}"
            python tools/split_volume.py "$source" --mode both --out-dir "$out"
            python - "$out" "$volume" <<'PY'
          from pathlib import Path
          import os, sys
          out_dir = Path(sys.argv[1])
          volume = sys.argv[2]
          lines = [f"## Splitter smoke test: volume {volume}", ""]
          for variant in ("variant_A", "variant_B"):
              folder = out_dir / variant
              chunks = sorted(folder.glob("chunk_*.md"))
              if not chunks or not (folder / "_index.md").is_file():
                  raise SystemExit(f"Missing chunks or index: {folder}")
              sizes = [len(p.read_text(encoding="utf-8").rstrip("\n")) for p in chunks]
              line = f"- {variant}: {len(chunks)} chunks; min/max chars {min(sizes):,}/{max(sizes):,}"
              print(line)
              lines.append(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n\n")
          PY
          done
      - name: Smoke-test actual sources for completed volumes 4 through 11
        run: |
          set -e
          for volume in 4 5 6 7 8 9 10 11; do
            out="$RUNNER_TEMP/volume${volume}-smoke"
            python tools/extract_epub.py --volume "$volume" --output-dir "$out"
            echo "- Volume $volume: extraction completed successfully" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Compare volume 4 extractor output with tracked source
        run: |
          python - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import json
          import os

          pairs = [
              ("completed_volumes/volume4.md", Path(os.environ["RUNNER_TEMP"]) / "volume4-smoke" / "volume4.md"),
              ("completed_volumes/volume4_report.md", Path(os.environ["RUNNER_TEMP"]) / "volume4-smoke" / "volume4_report.md"),
          ]
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## Comparison: tracked volume 4 vs lxml extractor\n\n")
              for tracked_name, generated_path in pairs:
                  tracked_path = Path(tracked_name)
                  if not tracked_path.exists() or not generated_path.exists():
                      out.write(f"- {tracked_name}: comparison unavailable (one or both files missing).\n")
                      continue
                  old_bytes = tracked_path.read_bytes()
                  new_bytes = generated_path.read_bytes()
                  old_text = old_bytes.decode("utf-8")
                  new_text = new_bytes.decode("utf-8")
                  old_lines = old_text.splitlines(keepends=True)
                  new_lines = new_text.splitlines(keepends=True)
                  matcher = difflib.SequenceMatcher(a=old_lines, b=new_lines, autojunk=False)
                  changed = [op for op in matcher.get_opcodes() if op[0] != "equal"]
                  added = sum(j2-j1 for tag, i1, i2, j1, j2 in changed if tag in {"insert", "replace"})
                  removed = sum(i2-i1 for tag, i1, i2, j1, j2 in changed if tag in {"delete", "replace"})
                  data = {
                      "file": tracked_name,
                      "identical_bytes": old_bytes == new_bytes,
                      "tracked_bytes": len(old_bytes),
                      "generated_bytes": len(new_bytes),
                      "tracked_lines": len(old_lines),
                      "generated_lines": len(new_lines),
                      "tracked_sha256": hashlib.sha256(old_bytes).hexdigest(),
                      "generated_sha256": hashlib.sha256(new_bytes).hexdigest(),
                      "line_similarity_ratio": round(matcher.ratio(), 6),
                      "changed_opcode_blocks": len(changed),
                      "approx_lines_added_or_replaced": added,
                      "approx_lines_removed_or_replaced": removed,
                  }
                  out.write("### " + tracked_name + "\n\n")
                  out.write(json.dumps(data, ensure_ascii=False, indent=2) + "\n\n")
                  print("VOLUME4_COMPARE " + json.dumps(data, ensure_ascii=False))
                  import re
                  def content_lines(value):
                      result = []
                      for line in value.splitlines():
                          line = line.strip()
                          if not line or line.startswith("<!--") or line.startswith("Служебное пояснение, не часть книги:"):
                              continue
                          def canon_image(m):
                              page, resource, occ = m.group(1), m.group(2), m.group(3)
                              return "[[EPUB_IMAGE:xhtml/" + page + ":" + Path(resource).name + ":occ-" + occ + "]]"
                          line = re.sub(r"\[\[EPUB_IMAGE:v\d+:xhtml/([^:]+):([^:]+):occ-(\d+)\]\]", canon_image, line)
                          line = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", line)
                          result.append(line)
                      return result
                  old_content_lines = content_lines(old_text)
                  new_content_lines = content_lines(new_text)
                  semantic_matcher = difflib.SequenceMatcher(a=old_content_lines, b=new_content_lines, autojunk=False)
                  old_ruby = re.findall(r"〔([^〕]*)〕", "\n".join(old_content_lines))
                  new_ruby = re.findall(r"〔([^〕]*)〕", "\n".join(new_content_lines))
                  old_images = re.findall(r"\[\[EPUB_IMAGE:[^\]]+\]\]", old_text)
                  new_images = re.findall(r"\[\[EPUB_IMAGE:[^\]]+\]\]", new_text)
                  def canon_markers(value):
                      out = []
                      for marker in re.findall(r"\[\[EPUB_IMAGE:v\d+:xhtml/([^:]+):([^:]+):occ-(\d+)\]\]", value):
                          page, resource, occ = marker
                          out.append((page, Path(resource).name, occ))
                      return out
                  semantic = {
                      "nonempty_content_lines_tracked": len(old_content_lines),
                      "nonempty_content_lines_generated": len(new_content_lines),
                      "content_line_similarity_ignoring_blank_lines_and_technical_comments": round(semantic_matcher.ratio(), 6),
                      "ruby_reading_sequences_identical": old_ruby == new_ruby,
                      "tracked_ruby_readings": len(old_ruby),
                      "generated_ruby_readings": len(new_ruby),
                      "image_marker_sequences_identical_after_path_normalization": canon_markers(old_text) == canon_markers(new_text),
                      "tracked_image_markers": len(old_images),
                      "generated_image_markers": len(new_images),
                      "different_content_blocks": len([op for op in semantic_matcher.get_opcodes() if op[0] != "equal"]),
                      "first_content_differences": [
                          {"type":tag,"tracked":old_content_lines[i1:i2][:3],"generated":new_content_lines[j1:j2][:3]}
                          for tag,i1,i2,j1,j2 in semantic_matcher.get_opcodes() if tag != "equal"
                      ][:10],
                  }
                  print("VOLUME4_CONTENT_COMPARE " + json.dumps(semantic, ensure_ascii=False))
                  diff = list(difflib.unified_diff(old_lines, new_lines, fromfile="tracked/" + tracked_name, tofile="lxml/" + tracked_name, n=2))
                  if diff:
                      out.write("First diff excerpt (at most 180 lines):\n\n")
                      out.writelines(diff[:180])
                      out.write("\n\n")
                      print("VOLUME4_DIFF_BEGIN " + tracked_name)
                      print("".join(diff[:60]))
                      print("VOLUME4_DIFF_END " + tracked_name)
          PY
      - name: Compare completed volumes 5 through 11 with fresh extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib
          import json
          import os
          import re

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          audit_lines = ["", "## Fresh extraction audit: volumes 5–11", ""]
          problems = []
          for volume in (5, 6, 7, 8, 9, 10, 11):
              out_dir = Path(os.environ["RUNNER_TEMP"]) / f"volume{volume}-smoke"
              for suffix in ("", "_report"):
                  tracked_name = f"completed_volumes/volume{volume}{suffix}.md"
                  tracked_path = Path(tracked_name)
                  generated_path = out_dir / f"volume{volume}{suffix}.md"
                  if not tracked_path.is_file() or not generated_path.is_file():
                      raise SystemExit(f"Missing tracked/generated comparison file: {tracked_name}")
                  old_bytes = tracked_path.read_bytes()
                  new_bytes = generated_path.read_bytes()
                  old_text = old_bytes.decode("utf-8")
                  new_text = new_bytes.decode("utf-8")
                  old_lines = old_text.splitlines(keepends=True)
                  new_lines = new_text.splitlines(keepends=True)
                  matcher = difflib.SequenceMatcher(a=old_lines, b=new_lines, autojunk=False)
                  data = {
                      "file": tracked_name,
                      "identical_bytes": old_bytes == new_bytes,
                      "tracked_bytes": len(old_bytes),
                      "fresh_bytes": len(new_bytes),
                      "tracked_sha256": hashlib.sha256(old_bytes).hexdigest(),
                      "fresh_sha256": hashlib.sha256(new_bytes).hexdigest(),
                      "line_similarity_ratio": round(matcher.ratio(), 6),
                      "changed_line_blocks": sum(op[0] != "equal" for op in matcher.get_opcodes()),
                  }
                  audit_lines.append("- " + json.dumps(data, ensure_ascii=False))
                  print("EXTRACT_COMPARE " + json.dumps(data, ensure_ascii=False))
                  if suffix == "":
                      def content_lines(value):
                          result = []
                          for line in value.splitlines():
                              line = line.strip()
                              if not line or line.startswith("<!--") or line.startswith("Служебное пояснение, не часть книги:"):
                                  continue
                              line = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", line)
                              result.append(line)
                          return result
                      old_content = content_lines(old_text)
                      new_content = content_lines(new_text)
                      semantic = difflib.SequenceMatcher(a=old_content, b=new_content, autojunk=False)
                      ruby_old = re.findall(r"〔([^〕]*)〕", "\n".join(old_content))
                      ruby_new = re.findall(r"〔([^〕]*)〕", "\n".join(new_content))
                      markers_old = re.findall(r"\[\[EPUB_IMAGE:[^\]]+\]\]", old_text)
                      markers_new = re.findall(r"\[\[EPUB_IMAGE:[^\]]+\]\]", new_text)
                      source_audit = {
                          "volume": volume,
                          "semantic_content_similarity": round(semantic.ratio(), 6),
                          "ruby_sequence_identical": ruby_old == ruby_new,
                          "tracked_ruby_count": len(ruby_old),
                          "fresh_ruby_count": len(ruby_new),
                          "image_marker_count_tracked": len(markers_old),
                          "image_marker_count_fresh": len(markers_new),
                          "image_marker_sequence_identical": markers_old == markers_new,
                          "first_content_differences": [
                              {"type": tag, "tracked": old_content[i1:i2][:2], "fresh": new_content[j1:j2][:2]}
                              for tag, i1, i2, j1, j2 in semantic.get_opcodes() if tag != "equal"
                          ][:3],
                      }
                      audit_lines.append("  - Source text audit: " + json.dumps(source_audit, ensure_ascii=False))
                      print("SOURCE_TEXT_AUDIT " + json.dumps(source_audit, ensure_ascii=False))
                      if source_audit["semantic_content_similarity"] < 0.99:
                          problems.append(f"Volume {volume} source semantic similarity below 0.99")
                      if not source_audit["ruby_sequence_identical"]:
                          problems.append(f"Volume {volume} ruby sequence differs from fresh extraction")
                      if not source_audit["image_marker_sequence_identical"]:
                          problems.append(f"Volume {volume} EPUB_IMAGE marker sequence differs from fresh extraction")
                  else:
                      required = [
                          r"XHTML parse errors:\s*0",
                          r"Расхождений текстового слоя абзацев:\s*0",
                          r"расхождений порядка ruby-чтений:\s*0",
                          r"ruby warnings:\s*0",
                      ]
                      for pattern in required:
                          if not re.search(pattern, new_text, flags=re.I):
                              problems.append(f"{tracked_name}: expected clean report marker missing: {pattern}")
          with summary_path.open("a", encoding="utf-8") as out:
              out.write("\n".join(audit_lines) + "\n")
          if problems:
              raise SystemExit("Fresh extraction audit failed:\n- " + "\n- ".join(problems))
          PY
      - name: Upload real-volume smoke-test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extractor-smoke-test-output
          path: |
            ${{ runner.temp }}/volume4-smoke/
            ${{ runner.temp }}/volume5-smoke/
            ${{ runner.temp }}/volume6-smoke/
            ${{ runner.temp }}/volume7-smoke/
            ${{ runner.temp }}/volume8-smoke/
            ${{ runner.temp }}/volume9-smoke/
            ${{ runner.temp }}/volume10-smoke/
            ${{ runner.temp }}/volume11-smoke/
          if-no-files-found: warn
