name: Build translated EPUB sample

on:
  push:
    branches: [main]
    paths:
      - "tools/build_epub.py"
      - ".github/workflows/build-epub-sample.yml"
      - "translated chunks/**"
      - "completed_volumes/volume4_report.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Markdown renderer
        run: python -m pip install "Markdown>=3.7,<4"
      - name: Check builder syntax
        run: python -m py_compile tools/build_epub.py
      - name: Build and validate the sample EPUB
        run: |
          python tools/build_epub.py \
            --volume 4 \
            --chunk-dir "translated chunks" \
            --report completed_volumes/volume4_report.md \
            --output-dir dist
      - name: Upload EPUB and validation summary
        uses: actions/upload-artifact@v4
        with:
          name: sukamoca-v4-ru-sample
          path: |
            dist/SukaMoca_v4_ru_sample.epub
            dist/SukaMoca_v4_ru_sample_report.json
          if-no-files-found: error
          retention-days: 14
