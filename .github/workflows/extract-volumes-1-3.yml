name: Extract and prepare source volumes 1–3

on:
  push:
    branches: [main]
    paths:
      - "raw/1/**"
      - "raw/2/**"
      - "raw/3/**"
      - "raw/english-raw/WorldEnd2-v01/**"
      - "raw/english-raw/WorldEnd2-v02/**"
      - "raw/english-raw/WorldEnd2-v03/**"
      - "tools/extract_epub.py"
      - "tools/extract_english_epub.py"
      - "tools/split_volume.py"
      - "tests/**"
      - ".github/workflows/extract-volumes-1-3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Compile extractors and splitter
        run: |
          python -m py_compile tools/extract_epub.py tools/extract_english_epub.py tools/split_volume.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Extract Japanese source volumes 1–3
        run: |
          set -e
          mkdir -p completed_volumes
          for volume in 1 2 3; do
            output="$RUNNER_TEMP/japanese-volume$volume"
            python tools/extract_epub.py --volume "$volume" --output-dir "$output"
            cp "$output/volume$volume.md" "completed_volumes/volume$volume.md"
            cp "$output/volume$volume""_report.md" "completed_volumes/volume$volume""_report.md"
          done

      - name: Extract English reference volumes 1–3
        run: |
          set -e
          mkdir -p completed_volumes/english
          for volume in 1 2 3; do
            python tools/extract_english_epub.py \
              --volume "$volume" \
              --output-dir completed_volumes/english
          done

      - name: Generate Variant B chunks only
        run: |
          set -e
          for volume in 1 2 3; do
            python tools/split_volume.py \
              "completed_volumes/volume$volume.md" \
              --mode b \
              --out-dir "Cut_Volumes/Volume$volume/variant_B"
            python tools/split_volume.py \
              "completed_volumes/english/volume$volume.md" \
              --mode b \
              --out-dir "Cut_Volumes/English/Volume$volume/variant_B"
          done

      - name: Verify exact reconstruction and untouched Variant A
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from tools import split_volume as splitter

          lines = ["## Source volumes 1–3 integrity check", ""]
          for language, source_root, cut_root in (
              ("Japanese", Path("completed_volumes"), Path("Cut_Volumes")),
              ("English", Path("completed_volumes/english"), Path("Cut_Volumes/English")),
          ):
              for volume in (1, 2, 3):
                  source = source_root / f"volume{volume}.md"
                  if not source.is_file():
                      raise SystemExit(f"Missing completed source: {source}")
                  _, expected = splitter.strip_wrappers(source.read_text(encoding="utf-8"))
                  folder = cut_root / f"Volume{volume}" / "variant_B"
                  index = folder / "_index.md"
                  chunks = sorted(folder.glob("chunk_*.md"))
                  if not chunks or not index.is_file():
                      raise SystemExit(f"Missing Variant B chunks or index: {folder}")
                  actual = "\n\n".join(p.read_text(encoding="utf-8").rstrip("\n") for p in chunks)
                  if actual != expected:
                      raise SystemExit(
                          f"{language} volume {volume}: reconstruction mismatch "
                          f"({len(actual)} != {len(expected)} chars)"
                      )
                  if (cut_root / f"Volume{volume}" / "variant_A").exists():
                      raise SystemExit(
                          f"Unexpected Variant A folder appeared under new {language} volume {volume}"
                      )
                  lines.append(
                      f"- {language} volume {volume}: {len(chunks)} Variant B chunks; "
                      f"exact reconstruction ({len(expected):,} chars)"
                  )
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload extracted sources, reports, and chunks for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-volumes-1-3-review
          path: |
            completed_volumes/volume1.md
            completed_volumes/volume1_report.md
            completed_volumes/volume2.md
            completed_volumes/volume2_report.md
            completed_volumes/volume3.md
            completed_volumes/volume3_report.md
            completed_volumes/english/
            Cut_Volumes/Volume1/variant_B/
            Cut_Volumes/Volume2/variant_B/
            Cut_Volumes/Volume3/variant_B/
            Cut_Volumes/English/
            $RUNNER_TEMP/japanese-volume1/
            $RUNNER_TEMP/japanese-volume2/
            $RUNNER_TEMP/japanese-volume3/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish generated files to a review branch
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            completed_volumes/volume1.md completed_volumes/volume1_report.md \
            completed_volumes/volume2.md completed_volumes/volume2_report.md \
            completed_volumes/volume3.md completed_volumes/volume3_report.md \
            completed_volumes/english \
            Cut_Volumes/Volume1/variant_B \
            Cut_Volumes/Volume2/variant_B \
            Cut_Volumes/Volume3/variant_B \
            Cut_Volumes/English
          if git diff --cached --quiet; then
            echo "Generated outputs already match the repository." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Extract and split Japanese and English source volumes 1–3"
          branch="chatgpt/source-volumes-1-3-review-$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          echo "Review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
