name: Generate review candidates for volumes 4 and 5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-review-volumes-4-5.yml"
      - "tools/extract_epub.py"
      - "tools/requirements.txt"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-review-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Compile extractor and run regression tests
        run: |
          python -m py_compile tools/extract_epub.py
          python -m unittest discover -s tests -v
      - name: Generate both volume candidates
        run: |
          set -e
          for volume in 4 5; do
            out="$RUNNER_TEMP/volume$volume-candidate"
            python tools/extract_epub.py --volume "$volume" --output-dir "$out"
            cp "$out/volume$volume.md" "./volume$volume.md"
            cp "$out/volume$volume""_report.md" "./volume$volume""_report.md"
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## Candidate files for volumes 4 and 5\n\n")
              for name in ("volume4.md", "volume4_report.md", "volume5.md", "volume5_report.md"):
                  data = Path(name).read_bytes()
                  out.write(f"- {name} — {len(data):,} bytes; SHA-256 {hashlib.sha256(data).hexdigest()}\n")
          PY
      - name: Publish candidates on a review branch (do not change main)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volume4.md volume4_report.md volume5.md volume5_report.md
          git commit -m "Regenerate source Markdown and reports for volumes 4 and 5"
          branch="chatgpt/extraction-review-$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          echo "Review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
