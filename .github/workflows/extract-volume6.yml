name: Generate volume 6 source extraction candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-volume6.yml"
      - "tools/extract_epub.py"
      - "tools/requirements.txt"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-volume6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Compile extractor and run regression tests
        run: |
          python -m py_compile tools/extract_epub.py
          python -m unittest discover -s tests -v
      - name: Generate candidate for volume 6
        run: |
          set -e
          python tools/extract_epub.py --volume 6 --output-dir "$RUNNER_TEMP/volume6-candidate"
          mkdir -p completed_volumes
          cp "$RUNNER_TEMP/volume6-candidate/volume6.md" ./completed_volumes/volume6.md
          cp "$RUNNER_TEMP/volume6-candidate/volume6_report.md" ./completed_volumes/volume6_report.md
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("\n## Volume 6 candidate files\n\n")
              for name in ("completed_volumes/volume6.md", "completed_volumes/volume6_report.md"):
                  data = Path(name).read_bytes()
                  out.write(f"- {name} — {len(data):,} bytes; SHA-256 {hashlib.sha256(data).hexdigest()}\n")
          PY
      - name: Publish candidate on a review branch (do not change main)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add completed_volumes/volume6.md completed_volumes/volume6_report.md
          git commit -m "Generate volume 6 Japanese source extraction candidate"
          branch="chatgpt/volume6-extraction-$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          echo "Review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
