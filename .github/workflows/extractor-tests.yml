name: EPUB source extractor checks

on:
  push:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/extractor-tests.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/extractor-tests.yml"
  workflow_dispatch:

jobs:
  extractor-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Compile extractor
        run: python -m py_compile tools/extract_epub.py
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
